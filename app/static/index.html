<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RecID - shop</title>
    <style>
      :root {
        --bg: #fff;
        --fg: #161616;
        --muted: #6b6b6b;
        --line: #e6e6e6;
        --accent: #c8102e;
        --soft: #f6f5f3;
        --radius: 6px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 30;
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      .bar {
        max-width: 1280px;
        margin: 0 auto;
        padding: 14px 20px;
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .logo {
        font-weight: 800;
        letter-spacing: 0.14em;
        font-size: 20px;
        color: var(--accent);
      }
      nav {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        flex: 1;
      }
      nav button {
        background: none;
        border: 0;
        padding: 8px 12px;
        border-radius: var(--radius);
        color: var(--fg);
        font-size: 14px;
      }
      nav button:hover {
        background: var(--soft);
      }
      nav button.on {
        font-weight: 700;
        box-shadow: inset 0 -2px 0 var(--accent);
        border-radius: 0;
      }
      .search {
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 8px 14px;
        width: 210px;
        font: inherit;
      }
      .bagbtn {
        background: var(--fg);
        color: #fff;
        border: 0;
        border-radius: 20px;
        padding: 9px 16px;
        font-size: 14px;
      }
      main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 24px 20px 120px;
      }
      h2 {
        margin: 0;
        font-size: 22px;
      }
      .sub {
        color: var(--muted);
        font-size: 14px;
        margin-top: 4px;
      }
      .head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 16px;
        gap: 16px;
        flex-wrap: wrap;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 20px 16px;
      }
      .card {
        cursor: pointer;
      }
      .card:hover .name {
        text-decoration: underline;
      }
      .imgwrap {
        position: relative;
        aspect-ratio: 2/3;
        background: var(--soft);
        overflow: hidden;
        border-radius: var(--radius);
      }
      .imgwrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.25s;
      }
      .card:hover .imgwrap img {
        transform: scale(1.03);
      }
      .ph {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #bbb;
        font-size: 13px;
      }
      .heart {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 0;
        background: rgba(255, 255, 255, 0.9);
        color: #bbb;
        font-size: 16px;
      }
      .heart.on {
        color: var(--accent);
      }
      .tag {
        position: absolute;
        left: 8px;
        bottom: 8px;
        background: rgba(22, 22, 22, 0.8);
        color: #fff;
        font-size: 11px;
        padding: 2px 7px;
        border-radius: 10px;
      }
      .meta {
        padding: 8px 2px;
      }
      .name {
        font-size: 14px;
        font-weight: 600;
      }
      .meta .sub {
        font-size: 12.5px;
        margin-top: 2px;
      }
      .pager {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
        margin: 28px 0 8px;
        color: var(--muted);
        font-size: 14px;
      }
      .pager button {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: var(--radius);
        padding: 8px 16px;
      }
      .pager button:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .arr {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
        transition: transform 0.18s ease;
      }
      .pager button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      #prev:not(:disabled):hover .arr {
        transform: translateX(-3px);
      }
      #next:not(:disabled):hover .arr {
        transform: translateX(3px);
      }
      .jump {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--accent);
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
      .jump:hover {
        text-decoration: underline;
      }
      .jump:hover .arr {
        transform: translateY(3px);
      }
      #recommended {
        margin-top: 56px;
        padding-top: 28px;
        border-top: 2px solid var(--fg);
        scroll-margin-top: 80px;
      }
      .pill {
        display: inline-block;
        font-size: 12px;
        padding: 3px 10px;
        border-radius: 12px;
        background: var(--soft);
        color: var(--muted);
        margin-left: 10px;
        vertical-align: middle;
      }
      .pill.model {
        background: #e8f3ea;
        color: #1d6b32;
      }
      .pill.flash {
        background: var(--accent);
        color: #fff;
      }
      .basedon {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 18px;
        font-size: 13px;
        color: var(--muted);
        flex-wrap: wrap;
      }
      .basedon img {
        width: 34px;
        height: 51px;
        object-fit: cover;
        border-radius: 4px;
        border: 1px solid var(--line);
      }
      .empty {
        padding: 40px;
        text-align: center;
        color: var(--muted);
        background: var(--soft);
        border-radius: var(--radius);
        grid-column: 1/-1;
      }
      #panel {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 60;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.14);
        padding: 12px 14px;
        width: 250px;
        font-size: 13px;
      }
      #panel label.t {
        display: block;
        font-weight: 700;
        margin-bottom: 6px;
      }
      #panel select {
        width: 100%;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        font: inherit;
      }
      #panel .row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      #panel .row button {
        flex: 1;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: var(--radius);
        padding: 6px;
        font-size: 12.5px;
      }
      #panel .chk {
        display: flex;
        gap: 7px;
        align-items: flex-start;
        margin-top: 8px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.3;
      }

      #panel {
        bottom: 64px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(12px);
        pointer-events: none;
        transition:
          opacity 0.18s,
          transform 0.18s,
          visibility 0.18s;
      }
      #panel.open {
        opacity: 1;
        visibility: visible;
        transform: none;
        pointer-events: auto;
      }
      #panelTab {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 61;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.14);
        padding: 9px 14px;
        font-size: 13px;
        color: var(--fg);
      }
      #panelTab:hover {
        border-color: var(--fg);
      }
      #panelTab.open .arr {
        transform: rotate(180deg);
      }

      #activity {
        display: none;
        position: absolute;
        bottom: calc(100% + 8px);
        left: 0;
        width: 330px;
        max-height: 300px;
        overflow: auto;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.14);
        padding: 10px 12px;
      }
      #activity.open {
        display: block;
      }
      #activity h4 {
        margin: 0 0 8px;
        font-size: 13px;
      }
      .ev {
        display: flex;
        gap: 8px;
        padding: 5px 0;
        border-top: 1px solid var(--line);
        font-size: 12px;
      }
      .ev:first-of-type {
        border-top: 0;
      }
      .ev time {
        color: var(--muted);
        width: 58px;
        flex: none;
      }
      .ev b {
        width: 92px;
        flex: none;
        font-weight: 600;
      }
      .scrim {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: 80;
      }
      .scrim.open {
        display: block;
      }
      #drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 380px;
        max-width: 100%;
        background: #fff;
        z-index: 90;
        transform: translateX(100%);
        transition: transform 0.25s;
        display: flex;
        flex-direction: column;
      }
      #drawer.open {
        transform: none;
      }
      #drawer header {
        position: static;
        padding: 16px 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      #bagitems {
        flex: 1;
        overflow: auto;
        padding: 0 18px;
      }
      .bagrow {
        display: flex;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
      }
      .bagrow img {
        width: 56px;
        height: 84px;
        object-fit: cover;
        border-radius: 4px;
        background: var(--soft);
      }
      .bagrow .x {
        margin-left: auto;
        border: 0;
        background: none;
        color: var(--muted);
      }
      #drawer footer {
        padding: 16px 18px;
        border-top: 1px solid var(--line);
      }
      .primary {
        width: 100%;
        background: var(--fg);
        color: #fff;
        border: 0;
        border-radius: var(--radius);
        padding: 13px;
        font-weight: 600;
      }
      .primary:disabled {
        opacity: 0.4;
      }
      .secondary {
        width: 100%;
        background: #fff;
        border: 1px solid var(--fg);
        border-radius: var(--radius);
        padding: 12px;
        font-weight: 600;
      }
      #modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 100;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      #modal.open {
        display: flex;
      }
      .mbox {
        background: #fff;
        border-radius: 10px;
        max-width: 820px;
        width: 100%;
        max-height: 92vh;
        overflow: auto;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        position: relative;
      }
      .mbox .pic {
        background: var(--soft);
        aspect-ratio: 2/3;
      }
      .mbox .pic img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .mbox .info {
        padding: 28px 26px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .mbox .info h3 {
        margin: 0;
        font-size: 22px;
      }
      .mbox .info p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }
      .close {
        position: absolute;
        top: 8px;
        right: 12px;
        border: 0;
        background: none;
        font-size: 26px;
        color: var(--muted);
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        background: var(--fg);
        color: #fff;
        padding: 10px 18px;
        border-radius: 20px;
        font-size: 13px;
        z-index: 120;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
      }
      #toast.show {
        opacity: 1;
      }
      @media (max-width: 700px) {
        .mbox {
          grid-template-columns: 1fr;
        }
        .search {
          width: 120px;
        }
        #panel {
          width: 210px;
        }
        #activity {
          width: 290px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <div class="logo">RecID</div>
        <nav id="nav"></nav>
        <input
          id="search"
          class="search"
          type="search"
          placeholder="Search products…"
        />
        <button class="bagbtn" id="bagbtn">
          Bag (<span id="bagcount">0</span>)
        </button>
      </div>
    </header>

    <main>
      <div class="head">
        <div>
          <h2 id="shoptitle">Bestsellers</h2>
          <div class="sub" id="shopsub"></div>
        </div>
        <a href="#recommended" class="jump"
          >Jump to recommendations
          <svg class="arr" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M6 13l6 6 6-6" /></svg
        ></a>
      </div>
      <div class="grid" id="grid"></div>
      <div class="pager">
        <div class="pager">
          <button id="prev">
            <svg class="arr" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19 12H5M11 6l-6 6 6 6" /></svg
            >Previous</button
          ><span id="pageinfo"></span
          ><button id="next">
            Next<svg class="arr" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </button>
        </div>
      </div>

      <section id="recommended">
        <div class="head">
          <div>
            <h2>Recommended <span class="pill" id="recpill"></span></h2>
            <div class="sub" id="recsub"></div>
          </div>
        </div>
        <div class="basedon" id="basedon"></div>
        <div class="grid" id="recgrid"></div>
      </section>
    </main>
    <button id="panelTab" aria-expanded="false" aria-controls="panel">
      Shopper: <b id="tabUser">User 1</b
      ><svg class="arr" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 15l6-6 6 6" />
      </svg>
    </button>
    <div id="panel">
      <div id="activity">
        <h4>Captured activity (latest first)</h4>
        <div id="actlist"></div>
      </div>
      <label class="t" for="userSel">Shopper</label>
      <select id="userSel"></select>
      <div class="row">
        <button id="actbtn">Activity <span id="nev">0</span></button
        ><button id="resetbtn">Reset user</button>
      </div>
      <label class="chk"
        ><input type="checkbox" id="viewsChk" /> Also count product views as
        signals (the model was trained on purchases only)</label
      >
      <label class="chk"
        ><input type="checkbox" id="rawChk" /> Raw model output (don't hide
        items already in the bag or repeated colours)</label
      >
    </div>

    <div class="scrim" id="scrim"></div>
    <aside id="drawer">
      <header>
        <h3 style="margin: 0">Your bag</h3>
        <button class="close" style="position: static" id="drawerx">x</button>
      </header>
      <div id="bagitems"></div>
      <footer><button class="primary" id="checkout">Checkout</button></footer>
    </aside>
    <div id="modal"><div class="mbox" id="mbox"></div></div>
    <div id="toast"></div>

    <script>
      "use strict";
      const $ = (s) => document.querySelector(s);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const api = async (url, opts) => {
        const r = await fetch(url, opts);
        if (!r.ok) throw new Error(url + " -> " + r.status);
        return r.json();
      };
      const S = {
        user: 1,
        group: "All",
        q: "",
        page: 1,
        perPage: 24,
        total: 0,
        bag: [],
        wish: new Set(),
        activity: [],
        nEvents: 0,
        recToken: 0,
      };
      window.ph = () => {
        const d = document.createElement("div");
        d.className = "ph";
        d.textContent = "no image";
        return d;
      };

      function toast(msg) {
        const t = $("#toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(toast.h);
        toast.h = setTimeout(() => t.classList.remove("show"), 1800);
      }
      const post = (type, item = null, meta = null) =>
        api("/api/event", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user: S.user, type, item, meta }),
        });

      async function refreshState() {
        const d = await api(`/api/user/${S.user}/state`);
        S.bag = d.bag;
        S.wish = new Set(d.wishlist);
        S.activity = d.activity;
        S.nEvents = d.n_events;
        $("#bagcount").textContent = S.bag.length;
        $("#nev").textContent = S.nEvents;
        document
          .querySelectorAll(".card .heart")
          .forEach((h) =>
            h.classList.toggle(
              "on",
              S.wish.has(+h.closest(".card").dataset.item),
            ),
          );
        renderActivity();
        renderBag();
      }
      async function act(type, item = null, meta = null) {
        // record, then refresh state + recommendations
        await post(type, item, meta);
        await Promise.all([
          refreshState(),
          item !== null ? refreshRecs() : Promise.resolve(),
        ]);
      }
      function card(it, tag) {
        const el = document.createElement("article");
        el.className = "card";
        el.dataset.item = it.item;
        el.innerHTML = `<div class="imgwrap"><img loading="lazy" src="/img/${it.item}" alt="${esc(it.name)}" onerror="this.replaceWith(ph())">
    <button class="heart ${S.wish.has(it.item) ? "on" : ""}" title="Add to wishlist" aria-label="wishlist">♥</button>
    ${tag ? `<span class="tag">${esc(tag)}</span>` : ""}</div>
    <div class="meta"><div class="name">${esc(it.name)}</div><div class="sub">${esc(it.colour)} · ${esc(it.type)}</div></div>`;
        el.addEventListener("click", () => openModal(it));
        el.querySelector(".heart").addEventListener("click", (e) => {
          e.stopPropagation();
          toggleWish(it);
        });
        return el;
      }
      const toggleWish = (it) =>
        act(S.wish.has(it.item) ? "unwishlist" : "wishlist", it.item).then(() =>
          toast(
            S.wish.has(it.item) ? "Saved to wishlist" : "Removed from wishlist",
          ),
        );

      async function loadCatalog() {
        const p = new URLSearchParams({
          group: S.group,
          q: S.q,
          page: S.page,
          per_page: S.perPage,
        });
        const d = await api("/api/catalog?" + p);
        S.total = d.total;
        const g = $("#grid");
        g.innerHTML = "";
        if (!d.items.length)
          g.innerHTML = `<div class="empty">No products match “${esc(S.q)}”.</div>`;
        d.items.forEach((it) => g.appendChild(card(it)));
        const pages = Math.max(1, Math.ceil(d.total / S.perPage));
        $("#pageinfo").textContent =
          `Page ${S.page} of ${pages} · ${d.total.toLocaleString()} products`;
        $("#prev").disabled = S.page <= 1;
        $("#next").disabled = S.page >= pages;
        $("#shoptitle").textContent =
          S.group === "All" ? "Bestsellers" : S.group;
        $("#shopsub").textContent = S.q
          ? `Results for “${S.q}”`
          : "Sorted by popularity";
      }

      async function refreshRecs() {
        const token = ++S.recToken; // ignore out-of-date responses (fast clicking / user switch)
        const d = await api(
          `/api/recommend/${S.user}?k=12&views=${$("#viewsChk").checked}&raw=${$("#rawChk").checked}`,
        );
        if (token !== S.recToken) return;
        const pill = $("#recpill"),
          grid = $("#recgrid");
        if (d.source === "model") {
          pill.textContent = "personalised";
          pill.className = "pill model";
          $("#recsub").textContent =
            `Generated by the semantic-ID transformer from ${d.n_history} item${d.n_history === 1 ? "" : "s"} in this shopper's activity` +
            (d.filled ? ` (${d.filled} filled with bestsellers)` : "");
        } else {
          pill.textContent = "popular right now";
          pill.className = "pill";
          $("#recsub").textContent =
            "No bag or purchase activity yet. Add items to the bag to personalise this section.";
        }
        $("#basedon").innerHTML = d.history.length
          ? "Based on: " +
            d.history
              .map(
                (h) =>
                  `<img src="/img/${h.item}" title="${esc(h.name)} (${esc(h.colour)})" onerror="this.style.visibility='hidden'">`,
              )
              .join("")
          : "";
        grid.innerHTML = "";
        d.items.forEach((it) =>
          grid.appendChild(
            card(
              it,
              d.source === "model" && it.tag === "popular" ? "bestseller" : "",
            ),
          ),
        );
        pill.classList.add("flash");
        setTimeout(() => pill.classList.remove("flash"), 700);
      }

      function renderBag() {
        const box = $("#bagitems");
        box.innerHTML = S.bag.length
          ? ""
          : `<p class="sub" style="padding:18px 0">Your bag is empty.</p>`;
        S.bag.forEach((it) => {
          const r = document.createElement("div");
          r.className = "bagrow";
          r.innerHTML = `<img src="/img/${it.item}" onerror="this.style.visibility='hidden'"><div><div class="name">${esc(it.name)}</div><div class="sub">${esc(it.colour)} · ${esc(it.type)}</div></div><button class="x" title="Remove">✕</button>`;
          r.querySelector(".x").addEventListener("click", () =>
            act("remove_from_cart", it.item),
          );
          box.appendChild(r);
        });
        $("#checkout").disabled = !S.bag.length;
      }
      function renderActivity() {
        const L = {
          view: "viewed",
          wishlist: "wishlisted",
          unwishlist: "un-wishlisted",
          add_to_cart: "added to bag",
          remove_from_cart: "removed from bag",
          purchase: "purchased",
          search: "searched",
          filter: "filtered",
        };
        $("#actlist").innerHTML = S.activity.length
          ? S.activity
              .map(
                (e) =>
                  `<div class="ev"><time>${new Date(e.ts * 1000).toLocaleTimeString()}</time><b>${L[e.type] || e.type}</b><span>${e.item ? esc(e.item.name) + " (" + esc(e.item.colour) + ")" : esc(e.meta || "")}</span></div>`,
              )
              .join("")
          : `<div class="sub">Nothing yet - browse the shop.</div>`;
      }
      function openModal(it) {
        const inBag = S.bag.some((b) => b.item === it.item);
        $("#mbox").innerHTML = `<button class="close" id="mclose">×</button>
    <div class="pic"><img src="/img/${it.item}" alt="${esc(it.name)}" onerror="this.replaceWith(ph())"></div>
    <div class="info"><h3>${esc(it.name)}</h3><p>${esc(it.colour)} · ${esc(it.type)}</p><p>${esc(it.group)}</p><div style="flex:1"></div>
      <button class="primary" id="addbag" ${inBag ? "disabled" : ""}>${inBag ? "In your bag" : "Add to bag"}</button>
      <button class="secondary" id="buynow">Buy now</button>
      <button class="secondary" id="wish" style="border-color:var(--line)">${S.wish.has(it.item) ? "♥ Wishlisted" : "♡ Add to wishlist"}</button></div>`;
        $("#modal").classList.add("open");
        $("#scrim").classList.add("open");
        document.body.dataset.modal = "1";
        $("#mclose").onclick = closeAll;
        $("#addbag").onclick = async () => {
          await act("add_to_cart", it.item);
          toast("Added to bag");
          closeAll();
        };
        $("#buynow").onclick = async () => {
          await act("purchase", it.item);
          toast("Order placed (simulated)");
          closeAll();
        };
        $("#wish").onclick = async () => {
          await toggleWish(it);
          openModal(it);
        };
        post("view", it.item).then(() =>
          Promise.all([refreshState(), refreshRecs()]),
        ); // opening a product page = a view event
      }
      function closeAll() {
        ["#modal", "#scrim", "#drawer"].forEach((s) =>
          $(s).classList.remove("open"),
        );
      }
      async function init() {
        const m = await api("/api/meta");
        $("#nav").innerHTML = ["All", ...m.groups.map((g) => g.name)]
          .map(
            (n) =>
              `<button data-g="${esc(n)}" class="${n === "All" ? "on" : ""}">${esc(n)}</button>`,
          )
          .join("");
        $("#nav").addEventListener("click", (e) => {
          const b = e.target.closest("button");
          if (!b) return;
          document
            .querySelectorAll("#nav button")
            .forEach((x) => x.classList.toggle("on", x === b));
          S.group = b.dataset.g;
          S.page = 1;
          loadCatalog();
          if (S.group !== "All")
            post("filter", null, "group: " + S.group).then(refreshState);
        });
        $("#userSel").innerHTML = Array.from(
          { length: m.n_users },
          (_, i) => `<option value="${i + 1}">User ${i + 1}</option>`,
        ).join("");
        try {
          const u = +localStorage.getItem("user");
          if (u >= 1 && u <= m.n_users) S.user = u;
        } catch (_) {}
        $("#userSel").value = S.user;
        syncTab();
        $("#userSel").onchange = async (e) => {
          S.user = +e.target.value;
          try {
            localStorage.setItem("user", S.user);
          } catch (_) {}
          await Promise.all([refreshState(), refreshRecs()]);
          toast("Switched to User " + S.user);
        };
        $("#resetbtn").onclick = async () => {
          await api(`/api/user/${S.user}/reset`, { method: "POST" });
          await Promise.all([refreshState(), refreshRecs()]);
          toast("User " + S.user + " reset");
        };
        $("#actbtn").onclick = () => $("#activity").classList.toggle("open");
        $("#viewsChk").onchange = $("#rawChk").onchange = refreshRecs;
        $("#prev").onclick = () => {
          S.page--;
          loadCatalog();
          scrollTo({ top: 0, behavior: "smooth" });
        };
        $("#next").onclick = () => {
          S.page++;
          loadCatalog();
          scrollTo({ top: 0, behavior: "smooth" });
        };
        let h;
        $("#search").addEventListener("input", (e) => {
          clearTimeout(h);
          h = setTimeout(() => {
            S.q = e.target.value.trim();
            S.page = 1;
            loadCatalog();
            if (S.q.length >= 2) post("search", null, S.q).then(refreshState);
          }, 700);
        });
        $("#bagbtn").onclick = () => {
          $("#drawer").classList.add("open");
          $("#scrim").classList.add("open");
        };
        $("#drawerx").onclick = $("#scrim").onclick = closeAll;
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") closeAll();
        });
        $("#checkout").onclick = async () => {
          const items = [...S.bag];
          for (const it of items) await post("purchase", it.item); // keep order of the bag
          await Promise.all([refreshState(), refreshRecs()]);
          closeAll();
          toast(
            `Order placed for ${items.length} item${items.length > 1 ? "s" : ""} (simulated)`,
          );
        };
        await Promise.all([loadCatalog(), refreshState(), refreshRecs()]);
      }
      (function () {
        const tab = $("#panelTab"),
          panel = $("#panel");
        const setOpen = (open) => {
          panel.classList.toggle("open", open);
          tab.classList.toggle("open", open);
          tab.setAttribute("aria-expanded", open);
          if (!open) $("#activity").classList.remove("open"); // fold the activity list away with the panel
        };
        window.syncTab = () => {
          $("#tabUser").textContent = "User " + $("#userSel").value;
        }; // tab shows who is active
        $("#userSel").addEventListener("change", syncTab);
        tab.addEventListener("click", (e) => {
          e.stopPropagation();
          setOpen(!panel.classList.contains("open"));
        });
        document.addEventListener("click", (e) => {
          if (!panel.contains(e.target)) setOpen(false);
        }); // click anywhere else -> hide
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") setOpen(false);
        });
      })();

      init().catch((e) => {
        console.error(e);
        document.body.insertAdjacentHTML(
          "afterbegin",
          `<p style="padding:20px;color:#c00">Could not reach the backend: ${esc(e.message)}</p>`,
        );
      });
    </script>
  </body>
</html>
